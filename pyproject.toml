[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "private-wire-workflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "PyMuPDF>=1.23",
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "rapidocr-onnxruntime>=1.3",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
